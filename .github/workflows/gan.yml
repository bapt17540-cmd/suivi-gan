name: Suivi GAN
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber
      - name: Lire le GAN et notifier
        env:
          CARTES: ${{ secrets.CARTES }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python gan.py
      - name: Publier les données
        run: |
          git config user.name "suivi-gan"
          git config user.email "suivi-gan@users.noreply.github.com"
          git add etat.json corrections.json
          git diff --cached --quiet || (git commit -m "Scan GAN" && git push)
